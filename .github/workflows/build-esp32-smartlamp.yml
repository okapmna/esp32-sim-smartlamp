name: Build & Deploy ESP32 Firmware

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g. 2.0.7, beta-1). Leave empty for dev-<sha>'
        type: string
        default: ''
        required: false
      deploy_ota:
        description: 'Deploy to OTA server'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install --no-cache-dir platformio

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Prepare secret.h
        run: |
          if [ ! -f include/secret.h ]; then
            cp secret.h.example include/secret.h
          fi

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build firmware (validation)
        if: github.event_name != 'release'
        run: platformio run -e esp32dev

      - name: Build firmware (release)
        if: github.event_name == 'release'
        env:
          PLATFORMIO_BUILD_FLAGS: -DCURRENT_VERSION=\"${{ steps.version.outputs.version }}\"
        run: platformio run -e esp32dev

      - name: Package firmware
        run: |
          mkdir -p dist
          cp .pio/build/esp32dev/firmware.bin "dist/smartlamp-${{ steps.version.outputs.version }}.bin"

      - name: Generate SHA-256 checksum
        run: |
          sha256sum "dist/smartlamp-${{ steps.version.outputs.version }}.bin" | cut -d' ' -f1 > "dist/smartlamp-${{ steps.version.outputs.version }}.bin.sha256"
          echo "Checksum: $(cat dist/smartlamp-${{ steps.version.outputs.version }}.bin.sha256)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smartlamp-firmware-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Upload to GitHub Release (release only)
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber

      - name: Deploy to OTA server (release or manual)
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.deploy_ota)
        env:
          OTA_API_KEY: ${{ secrets.OTA_API_KEY }}
          OTA_UPLOAD_URL: ${{ secrets.OTA_UPLOAD_URL }}
          UPLOADED_BY: ${{ github.actor }}
          SOURCE_REPO: ${{ github.server_url }}/${{ github.repository }}
        run: |
          FIRMWARE="dist/smartlamp-${{ steps.version.outputs.version }}.bin"
          CHECKSUM_FILE="dist/smartlamp-${{ steps.version.outputs.version }}.bin.sha256"
          if [ -z "$OTA_UPLOAD_URL" ] || [ -z "$OTA_API_KEY" ]; then
            echo "::warning::OTA_UPLOAD_URL or OTA_API_KEY not set, skipping"
            exit 0
          fi
          CHECKSUM=$(cat "$CHECKSUM_FILE")
          curl -fsS -X POST "$OTA_UPLOAD_URL" \
               -F "firmware=@$FIRMWARE" \
               -F "version=${{ steps.version.outputs.version }}" \
               -F "device_type=esp32-smartlamp" \
               -F "checksum=$CHECKSUM" \
               -F "uploaded_by=$UPLOADED_BY" \
               -F "source_repo=$SOURCE_REPO" \
               -H "x-api-key: $OTA_API_KEY"