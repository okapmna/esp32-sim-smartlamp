name: Build & Deploy ESP32 Firmware

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install --no-cache-dir platformio

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Prepare secret.h
        run: |
          if [ ! -f include/secret.h ]; then
            cp secret.h.example include/secret.h
          fi

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build firmware (validation)
        if: github.event_name != 'release'
        run: platformio run -e esp32dev

      - name: Build firmware (release)
        if: github.event_name == 'release'
        run: platformio run -e esp32dev --build-flags "-DCURRENT_VERSION=\"${{ steps.version.outputs.version }}\""

      - name: Package firmware
        run: |
          mkdir -p dist
          cp .pio/build/esp32dev/firmware.bin "dist/smartlamp-${{ steps.version.outputs.version }}.bin"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smartlamp-firmware-${{ steps.version.outputs.version }}
          path: dist/*.bin
          if-no-files-found: error

      - name: Deploy to OTA server (release only)
        if: github.event_name == 'release'
        env:
          OTA_API_KEY: ${{ secrets.OTA_API_KEY }}
          OTA_UPLOAD_URL: ${{ secrets.OTA_UPLOAD_URL }}
        run: |
          FIRMWARE="dist/smartlamp-${{ steps.version.outputs.version }}.bin"
          if [ -z "$OTA_UPLOAD_URL" ] || [ -z "$OTA_API_KEY" ]; then
            echo "::warning::OTA_UPLOAD_URL or OTA_API_KEY not set, skipping"
            exit 0
          fi
          curl -fsS -X POST "$OTA_UPLOAD_URL" \
               -F "firmware=@$FIRMWARE" \
               -F "version=${{ steps.version.outputs.version }}" \
               -F "device_type=esp32-smartlamp" \
               -H "x-api-key: $OTA_API_KEY"
